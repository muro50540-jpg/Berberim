<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel • KADİR PAK HAİR STÜDİO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<header class="topbar"><a class="back" href="index.html">←</a><div><strong>KADİR PAK</strong><small>HAİR STÜDİO</small></div><button id="logout" class="mini" hidden>Çıkış</button></header>
<main id="loginCard" class="card login-card">
 <div class="eyebrow">YÖNETİM</div><h1>Berber Paneli</h1><p class="muted">Randevuları buradan yönetin.</p>
 <form id="loginForm"><input id="email" type="email" placeholder="E-posta" required><input id="password" type="password" placeholder="Şifre" required><button class="btn primary fullbtn">GİRİŞ YAP</button><div id="loginMsg"></div></form>
</main>
<main id="panel" hidden>
 <div class="panel-head"><div><div class="eyebrow">BUGÜN</div><h1>Randevular</h1></div><div id="count" class="pill">0 randevu</div></div>
 <div id="list" class="appointments"></div>
</main>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,query,orderBy,onSnapshot,doc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAKrffq7wJ0mDtPdsShYworqCIRYkR2okM",authDomain:"berberim-83c47.firebaseapp.com",projectId:"berberim-83c47",storageBucket:"berberim-83c47.firebasestorage.app",messagingSenderId:"235586545993",appId:"1:235586545993:web:c05d6500909c27f4f81298",measurementId:"G-CBR04D6NZ6"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const loginCard=document.querySelector("#loginCard"),panel=document.querySelector("#panel"),logout=document.querySelector("#logout");
document.querySelector("#loginForm").addEventListener("submit",async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,email.value,password.value);loginMsg.textContent="";}catch(err){loginMsg.className="notice error";loginMsg.textContent="E-posta veya şifre hatalı.";}});logout.onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
 if(!user){loginCard.hidden=false;panel.hidden=true;logout.hidden=true;return;}
 loginCard.hidden=true;panel.hidden=false;logout.hidden=false;
 const q=query(collection(db,"appointments"),orderBy("createdAt","desc"));
 onSnapshot(q,snap=>{count.textContent=`${snap.size} randevu`;list.innerHTML="";snap.forEach(d=>{const a=d.data(),el=document.createElement("article");el.className="appointment";
 el.innerHTML=`<div><b>${a.name||"İsimsiz"}</b><span>${a.service||"-"} • ${a.barber||"-"}</span><span>${a.date||"-"} • ${a.time||"-"} • ${a.phone||"-"}</span></div><div class="appt-actions"><select><option ${a.status==="Bekliyor"?"selected":""}>Bekliyor</option><option ${a.status==="Onaylandı"?"selected":""}>Onaylandı</option><option ${a.status==="Tamamlandı"?"selected":""}>Tamamlandı</option><option ${a.status==="İptal"?"selected":""}>İptal</option></select><button class="danger">Sil</button></div>`;
 const sel=el.querySelector("select");sel.onchange=()=>updateDoc(doc(db,"appointments",d.id),{status:sel.value});el.querySelector(".danger").onclick=()=>{if(confirm("Bu randevu silinsin mi?"))deleteDoc(doc(db,"appointments",d.id))};list.appendChild(el);});});
});
</script>
</body>
</html>
