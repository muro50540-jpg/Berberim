<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetici</title><link rel="stylesheet" href="style.css"></head><body><header class="adminbar"><div class="wrap adminbarin"><a class="secondary" href="index.html">←</a><div class="adminbrand">KADİR PAK HAİR STÜDİO</div><button id="settings" class="logout hidden">AYARLAR</button><button id="logout" class="logout hidden">ÇIKIŞ</button></div></header><main class="wrap" style="padding:20px 0 45px"><section id="login" class="card" style="max-width:430px;margin:40px auto"><span class="kicker">YÖNETİCİ</span><h2>Panele giriş</h2><input id="email" class="input" placeholder="E-posta"><br><br><input id="pass" class="input" type="password" placeholder="Şifre"><br><br><button id="loginBtn" class="primary" style="width:100%">GİRİŞ YAP →</button><p id="loginMsg" class="message"></p></section><section id="panel" class="hidden"><div class="stats"><div class="metric"><small>TOPLAM CİRO</small><strong id="rev">₺0</strong><span>Tamamlanan</span></div><div class="metric"><small>BU AY</small><strong id="mrev">₺0</strong><span>Tamamlanan</span></div><div class="metric"><small>AKTİF</small><strong id="active">0</strong><span>Bekleyen + onaylı</span></div><div class="metric"><small>ORT. ARALIK</small><strong id="interval">—</strong><span>Gün</span></div></div><div class="two"><section class="card"><span class="kicker">MÜŞTERİLER</span><h2>En çok gelenler</h2><div id="customers"></div></section><section class="card"><span class="kicker">TAHMİN</span><h2>Yaklaşan müşteri</h2><div id="forecast"></div></section></div><section class="card"><span class="kicker">HİZMETLER</span><h2>Tercihler</h2><div id="services" class="service-grid"></div></section><div class="filters"><button class="filter active" data-m="today">BUGÜN</button><button class="filter" data-m="month">BU AY</button><button class="filter" data-m="all">TÜMÜ</button><button class="filter" data-m="archive">ARŞİV</button></div><div id="list"></div></section></main><div id="modal" class="modal hidden"><div class="backdrop"></div><div class="sheet"><button id="close" class="close">×</button><span class="kicker">AYARLAR</span><h2>Şifre değiştir</h2><div class="settingsrow"><label>E-POSTA</label><input id="setEmail" class="input" readonly></div><div class="settingsrow"><label>YENİ ŞİFRE</label><input id="np" class="input" type="password"></div><div class="settingsrow"><label>TEKRAR</label><input id="np2" class="input" type="password"></div><button id="save" class="primary" style="width:100%">ŞİFREYİ DEĞİŞTİR</button><p id="sm" class="message"></p></div></div><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,updatePassword} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";import {getFirestore,collection,getDocs,query,orderBy,doc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAKrffq7wJ0mDtPdsShYworqCIRYkR2okM",authDomain:"berberim-83c47.firebaseapp.com",projectId:"berberim-83c47",storageBucket:"berberim-83c47.firebasestorage.app",messagingSenderId:"235586545993",appId:"1:235586545993:web:c05d6500909c27f4f81298",measurementId:"G-CBR04D6NZ6"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);let all=[],mode="today";
const today=()=>new Date().toISOString().slice(0,10),month=()=>today().slice(0,7),money=n=>"₺"+Number(n||0).toLocaleString("tr-TR"),nice=d=>new Date(d+"T12:00:00").toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"});
$("#loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("#email").value.trim(),$("#pass").value)}catch(e){$("#loginMsg").textContent="E-posta veya şifre hatalı."}};$("#logout").onclick=()=>signOut(auth);
async function load(){let s=await getDocs(query(collection(db,"appointments"),orderBy("date")));all=s.docs.map(x=>({id:x.id,...x.data()}));calc();render()}
function groups(){let g={};all.filter(x=>x.status!=="İptal").forEach(a=>{let k=(a.phone||a.name||"").replace(/\s/g,"").toLowerCase();(g[k]??=[]).push(a)});return g}
function pred(a){let d=[...new Set(a.map(x=>x.date))].sort();if(d.length<2)return "Yeterli geçmiş yok";let q=[];for(let i=1;i<d.length;i++)q.push(Math.round((new Date(d[i]+"T12:00:00")-new Date(d[i-1]+"T12:00:00"))/86400000));let avg=Math.round(q.reduce((x,y)=>x+y,0)/q.length),x=new Date(d.at(-1)+"T12:00:00");x.setDate(x.getDate()+Math.max(1,avg));return "≈ "+x.toLocaleDateString("tr-TR",{day:"2-digit",month:"short"})}
function calc(){let done=all.filter(x=>x.status==="Tamamlandı");$("#rev").textContent=money(done.reduce((s,x)=>s+Number(x.price||0),0));$("#mrev").textContent=money(done.filter(x=>x.date?.startsWith(month())).reduce((s,x)=>s+Number(x.price||0),0));$("#active").textContent=all.filter(x=>["Bekliyor","Onaylandı"].includes(x.status)).length;let g=groups(),ints=[];Object.values(g).forEach(a=>{let d=[...new Set(a.map(x=>x.date))].sort();for(let i=1;i<d.length;i++)ints.push(Math.round((new Date(d[i]+"T12:00:00")-new Date(d[i-1]+"T12:00:00"))/86400000))});$("#interval").textContent=ints.length?Math.round(ints.reduce((a,b)=>a+b,0)/ints.length):"—";let r=Object.values(g).sort((a,b)=>b.length-a.length).slice(0,6);$("#customers").innerHTML=r.map((a,i)=>`<div class="rank"><i>${i+1}</i><div><strong>${a[0].name}</strong><span>${a.length} ziyaret • son ${nice([...a].sort((x,y)=>y.date.localeCompare(x.date))[0].date)}</span></div><em>${pred(a)}</em></div>`).join("")||'<div class="empty">Henüz müşteri yok.</div>';let sm={};all.filter(x=>x.status!=="İptal").forEach(x=>sm[x.service||"Belirtilmemiş"]=(sm[x.service||"Belirtilmemiş"]||0)+1);$("#services").innerHTML=Object.entries(sm).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="service"><span class="main"><strong>${x[0]}</strong><small>Toplam tercih</small></span><b>${x[1]}</b></div>`).join("")||'<div class="empty">Henüz veri yok.</div>';let n=all.filter(x=>x.date>=today()&&x.status!=="İptal").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];$("#forecast").innerHTML=n?`<strong>${n.name}</strong><br>${nice(n.date)} • ${n.time}<br>${n.service}`:"Yaklaşan randevu yok."}
function render(){let t=today(),m=month(),a=mode==="today"?all.filter(x=>x.date===t):mode==="month"?all.filter(x=>x.date?.startsWith(m)):mode==="archive"?all.filter(x=>x.date<t):all;if(!a.length){$("#list").innerHTML='<div class="empty">Bu görünümde randevu yok.</div>';return}$("#list").innerHTML=a.map(x=>`<article class="appt"><div class="apptdate"><strong>${x.time}</strong><span>${nice(x.date)}</span></div><div class="apptperson"><strong>${x.name}</strong><span>${x.phone}</span></div><div class="apptservice"><span>${x.service||"Hizmet"}</span><strong>${money(x.price)}</strong></div><div class="appt-actions"><select class="status" data-id="${x.id}">${["Bekliyor","Onaylandı","Tamamlandı","İptal"].map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select><button class="del" data-del="${x.id}">Sil</button></div></article>`).join("");document.querySelectorAll(".status").forEach(s=>s.onchange=async()=>{await updateDoc(doc(db,"appointments",s.dataset.id),{status:s.value});let x=all.find(a=>a.id===s.dataset.id);x.status=s.value;calc();render()});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Randevu silinsin mi?")){await deleteDoc(doc(db,"appointments",b.dataset.del));all=all.filter(x=>x.id!==b.dataset.del);calc();render()}})}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.m;render()});
$("#settings").onclick=()=>{$("#setEmail").value=auth.currentUser?.email||"";$("#modal").classList.remove("hidden")};$("#close").onclick=()=>$("#modal").classList.add("hidden");document.querySelector("#modal .backdrop").onclick=()=>$("#modal").classList.add("hidden");$("#save").onclick=async()=>{let a=$("#np").value,b=$("#np2").value;if(a.length<6)return $("#sm").textContent="Şifre en az 6 karakter.";if(a!==b)return $("#sm").textContent="Şifreler eşleşmiyor.";try{await updatePassword(auth.currentUser,a);$("#sm").textContent="✓ Şifre değiştirildi."}catch(e){$("#sm").textContent="Tekrar giriş yapıp deneyin."}};
onAuthStateChanged(auth,u=>{if(u&&!u.isAnonymous){$("#login").classList.add("hidden");$("#panel").classList.remove("hidden");$("#settings").classList.remove("hidden");$("#logout").classList.remove("hidden");load()}else{$("#login").classList.remove("hidden");$("#panel").classList.add("hidden")}})
</script></body></html>
