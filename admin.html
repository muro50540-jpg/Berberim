<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetici Paneli</title><link rel="stylesheet" href="style.css"></head>
<body><main class="admin"><header><a href="index.html" class="back">‹</a><div><b>KADİR PAK HAİR STÜDİO</b><small>YÖNETİCİ PANELİ</small></div></header>
<section id="login" class="panel"><h2>Yönetici Girişi</h2><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="loginBtn" class="btn primary">GİRİŞ YAP</button><div id="loginMsg" class="msg"></div></section>
<section id="dashboard" hidden><div class="admin-top"><div><h2>Randevular</h2><p id="stats"></p></div><button id="logout" class="btn secondary">ÇIKIŞ</button></div><div id="appointments" class="appointments"></div></section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {getFirestore,collection,query,orderBy,onSnapshot,doc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAKrffq7wJ0mDtPdsShYworqCIRYkR2okM",
  authDomain: "berberim-83c47.firebaseapp.com",
  projectId: "berberim-83c47",
  storageBucket: "berberim-83c47.firebasestorage.app",
  messagingSenderId: "235586545993",
  appId: "1:235586545993:web:c05d6500909c27f4f81298",
  measurementId: "G-CBR04D6NZ6"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let unsub=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
document.getElementById('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value)}catch(e){loginMsg.className='msg error';loginMsg.textContent='E-posta veya şifre hatalı.'}};
logout.onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{login.hidden=!!user;dashboard.hidden=!user;if(user)listen()});
function listen(){if(unsub)unsub();const q=query(collection(db,'appointments'),orderBy('date'));unsub=onSnapshot(q,snap=>{let rows=snap.docs.map(d=>({id:d.id,...d.data()}));rows.sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time));stats.textContent=rows.length+' randevu';appointments.innerHTML=rows.length?rows.map(render).join(''):'<div class="empty">Henüz randevu yok.</div>';bind()})}
function render(a){return `<article class="appt"><div class="appt-main"><strong>${esc(a.name)}</strong><span>📅 ${esc(a.date)} &nbsp; 🕐 ${esc(a.time)}</span><span>✂️ ${esc(a.service||'Saç Sakal')} · ₺${a.price||700}</span><span>📞 ${esc(a.phone)}</span></div><div class="actions"><select data-id="${a.id}" class="status"><option ${a.status==='Bekliyor'?'selected':''}>Bekliyor</option><option ${a.status==='Onaylandı'?'selected':''}>Onaylandı</option><option ${a.status==='Tamamlandı'?'selected':''}>Tamamlandı</option><option ${a.status==='İptal'?'selected':''}>İptal</option></select><button class="danger delete" data-id="${a.id}">SİL</button></div></article>`}
function bind(){document.querySelectorAll('.status').forEach(s=>s.onchange=async()=>{try{await updateDoc(doc(db,'appointments',s.dataset.id),{status:s.value,statusUpdatedAt:new Date()})}catch(e){alert('Randevu durumu kaydedilemedi. Firebase bağlantısını ve Firestore kurallarını kontrol edin.');console.error(e)}});document.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(confirm('Bu randevu silinsin mi?'))try{await deleteDoc(doc(db,'appointments',b.dataset.id))}catch(e){alert('Silinemedi.')}})}
</script></body></html>
