<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim • KADİR PAK HAİR STÜDİO</title><link rel="stylesheet" href="style.css"></head>
<body class="booking-body"><header class="booking-nav"><a href="index.html" class="back">‹</a><div class="brand">KADİR PAK <span>HAİR STÜDİO</span></div><button id="logout" class="logout" hidden>Çıkış</button></header>
<main class="admin-wrap"><div id="login" class="admin-card"><div class="section-title">YÖNETİM PANELİ</div><h1>Randevular</h1><form id="loginForm"><input id="email" type="email" placeholder="E-posta" required><input id="password" type="password" placeholder="Şifre" required><button class="main-btn">Giriş Yap</button><div id="loginMsg"></div></form></div>
<div id="panel" hidden><div class="admin-head"><h1>Randevular</h1><span id="count"></span></div><div id="list"></div></div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getFirestore,collection,query,orderBy,onSnapshot,doc,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const c={apiKey:"AIzaSyAKrffq7wJ0mDtPdsShYworqCIRYkR2okM",authDomain:"berberim-83c47.firebaseapp.com",projectId:"berberim-83c47",storageBucket:"berberim-83c47.firebasestorage.app",messagingSenderId:"235586545993",appId:"1:235586545993:web:c05d6500909c27f4f81298",measurementId:"G-CBR04D6NZ6"},a=initializeApp(c),auth=getAuth(a),db=getFirestore(a);
loginForm.onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,email.value,password.value)}catch(e){loginMsg.className="notice error";loginMsg.textContent="E-posta veya şifre hatalı."}};logout.onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(!u){login.hidden=false;panel.hidden=true;logout.hidden=true;return}login.hidden=true;panel.hidden=false;logout.hidden=false;onSnapshot(query(collection(db,"appointments"),orderBy("createdAt","desc")),s=>{count.textContent=s.size+" randevu";list.innerHTML="";s.forEach(x=>{let d=x.data(),el=document.createElement("div");el.className="admin-item";el.innerHTML=`<div><b>${d.name||"-"}</b><small>${d.service||"-"} • ${d.barber||"-"} • ₺${d.price||0}</small><small>${d.date||"-"} • ${d.time||"-"} • ${d.phone||"-"}</small></div><div><select><option>Bekliyor</option><option>Onaylandı</option><option>Tamamlandı</option><option>İptal</option></select><button class="delete">Sil</button></div>`;let q=el.querySelector("select");q.value=d.status||"Bekliyor";q.onchange=()=>updateDoc(doc(db,"appointments",x.id),{status:q.value});el.querySelector(".delete").onclick=()=>{if(confirm("Randevu silinsin mi?"))deleteDoc(doc(db,"appointments",x.id))};list.appendChild(el)})})});
</script></body></html>
