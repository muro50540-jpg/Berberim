<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetici | KADİR PAK HAİR STÜDİO</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="adminbar"><div class="wrap adminbarin"><a class="secondary" href="index.html">←</a><div class="adminbrand">KADİR PAK HAİR STÜDİO</div><button id="settings" class="logout hidden" type="button">AYARLAR</button><button id="logout" class="logout hidden" type="button">ÇIKIŞ</button></div></header>
<main class="wrap" style="padding:20px 0 45px">
<section id="login" class="login-card"><span class="kicker">YÖNETİCİ GİRİŞİ</span><h2>Panele giriş yapın</h2><p class="login-help">Yalnızca yetkili hesapla giriş yapılabilir.</p><input id="email" class="input" autocomplete="username" placeholder="E-posta"><input id="pass" class="input" autocomplete="current-password" type="password" placeholder="Şifre"><button id="loginBtn" class="primary-btn wide" type="button">GİRİŞ YAP →</button><button id="forgotBtn" class="link-btn" type="button">Şifremi unuttum</button><p id="loginMsg" class="message"></p></section>
<section id="panel" class="hidden">
<div class="stats"><div class="metric"><small>TOPLAM CİRO</small><strong id="rev">₺0</strong><span>Tamamlanan</span></div><div class="metric"><small>BU AY</small><strong id="mrev">₺0</strong><span>Tamamlanan</span></div><div class="metric"><small>AKTİF</small><strong id="active">0</strong><span>Bekleyen + onaylı</span></div><div class="metric"><small>ORT. ARALIK</small><strong id="interval">—</strong><span>Gün</span></div></div>
<div class="two"><section class="card"><span class="kicker">MÜŞTERİLER</span><h2>En çok gelenler</h2><div id="customers"></div></section><section class="card"><span class="kicker">YAKLAŞAN</span><h2>Sonraki randevu</h2><div id="forecast"></div></section></div>
<section class="card"><span class="kicker">HİZMETLER</span><h2>Tercihler</h2><div id="services" class="service-grid"></div></section>
<div class="filters"><button class="filter active" data-m="today" type="button">BUGÜN</button><button class="filter" data-m="month" type="button">BU AY</button><button class="filter" data-m="all" type="button">TÜMÜ</button><button class="filter" data-m="archive" type="button">ARŞİV</button></div><div id="list"></div>
</section></main>
<div id="modal" class="modal hidden"><div class="backdrop"></div><div class="sheet"><button id="close" class="close" type="button">×</button><span class="kicker">AYARLAR</span><h2>Hesap ayarları</h2><div class="settingsrow"><label>E-POSTA</label><input id="setEmail" class="input" readonly></div><div class="settingsrow"><label>YENİ ŞİFRE</label><input id="np" class="input" type="password" placeholder="En az 6 karakter"></div><div class="settingsrow"><label>TEKRAR</label><input id="np2" class="input" type="password" placeholder="Şifreyi tekrar yazın"></div><button id="save" class="primary-btn wide" type="button">ŞİFREYİ DEĞİŞTİR</button><p id="sm" class="message"></p></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,updatePassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,updateDoc,deleteDoc,runTransaction} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAKrffq7wJ0mDtPdsShYworqCIRYkR2okM",authDomain:"berberim-83c47.firebaseapp.com",projectId:"berberim-83c47",storageBucket:"berberim-83c47.firebasestorage.app",messagingSenderId:"235586545993",appId:"1:235586545993:web:c05d6500909c27f4f81298",measurementId:"G-CBR04D6NZ6"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s),ADMIN="kadirpak@gmail.com";let all=[],mode="today";
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const month=()=>today().slice(0,7);const money=n=>"₺"+Number(n||0).toLocaleString("tr-TR");const nice=d=>d?new Date(d+"T12:00:00").toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"}):"—";
$("#loginBtn").onclick=async()=>{const email=$("#email").value.trim().toLowerCase(),pass=$("#pass").value;if(!email||!pass){$("#loginMsg").textContent="E-posta ve şifreyi yazın.";return}if(email!==ADMIN){$("#loginMsg").textContent="Bu hesap yönetici hesabı değil.";return}try{await signInWithEmailAndPassword(auth,email,pass)}catch(e){console.error(e);$("#loginMsg").textContent=e.code==="auth/too-many-requests"?"Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.":"E-posta veya şifre hatalı."}};
$("#forgotBtn").onclick=async()=>{const email=$("#email").value.trim().toLowerCase();if(email!==ADMIN){$("#loginMsg").textContent="Önce yönetici e-postasını yazın: kadirpak@gmail.com";return}try{await sendPasswordResetEmail(auth,email);$("#loginMsg").textContent="✓ Şifre sıfırlama e-postası gönderildi."}catch(e){console.error(e);$("#loginMsg").textContent="E-posta gönderilemedi. Firebase'de Email/Password girişini kontrol edin."}};$("#logout").onclick=()=>signOut(auth);
async function load(){try{const s=await getDocs(collection(db,"appointments"));all=s.docs.map(x=>({id:x.id,...x.data()}));calc();render()}catch(e){console.error(e);$("#list").innerHTML='<div class="empty">Randevular yüklenemedi. Firebase Firestore kurallarını kontrol edin.</div>'}}
function groups(){const g={};all.filter(x=>x.status!=="İptal").forEach(a=>{const k=(a.phone||a.name||"").replace(/\s/g,"").toLowerCase();if(!k)return;(g[k]??=[]).push(a)});return g}
function pred(a){const d=[...new Set(a.map(x=>x.date).filter(Boolean))].sort();if(d.length<2)return "Yeterli geçmiş yok";const q=[];for(let i=1;i<d.length;i++)q.push(Math.round((new Date(d[i]+"T12:00:00")-new Date(d[i-1]+"T12:00:00"))/86400000));const avg=Math.round(q.reduce((x,y)=>x+y,0)/q.length),x=new Date(d.at(-1)+"T12:00:00");x.setDate(x.getDate()+Math.max(1,avg));return "≈ "+x.toLocaleDateString("tr-TR",{day:"2-digit",month:"short"})}
function calc(){const done=all.filter(x=>x.status==="Tamamlandı");$("#rev").textContent=money(done.reduce((s,x)=>s+Number(x.price||0),0));$("#mrev").textContent=money(done.filter(x=>x.date?.startsWith(month())).reduce((s,x)=>s+Number(x.price||0),0));$("#active").textContent=all.filter(x=>["Bekliyor","Onaylandı"].includes(x.status)).length;const g=groups(),ints=[];Object.values(g).forEach(a=>{const d=[...new Set(a.map(x=>x.date).filter(Boolean))].sort();for(let i=1;i<d.length;i++)ints.push(Math.round((new Date(d[i]+"T12:00:00")-new Date(d[i-1]+"T12:00:00"))/86400000))});$("#interval").textContent=ints.length?Math.round(ints.reduce((a,b)=>a+b,0)/ints.length):"—";const r=Object.values(g).sort((a,b)=>b.length-a.length).slice(0,6);$("#customers").innerHTML=r.map((a,i)=>{const latest=[...a].sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time))[0];return `<div class="rank"><i>${i+1}</i><div><strong>${latest.name||"İsimsiz"}</strong><span>${a.length} ziyaret • son ${nice(latest.date)}</span></div><em>${pred(a)}</em></div>`}).join("")||'<div class="empty">Henüz müşteri yok.</div>';const sm={};all.filter(x=>x.status!=="İptal").forEach(x=>sm[x.service||"Belirtilmemiş"]=(sm[x.service||"Belirtilmemiş"]||0)+1);$("#services").innerHTML=Object.entries(sm).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="service"><span class="main"><strong>${x[0]}</strong><small>Toplam tercih</small></span><b>${x[1]}</b></div>`).join("")||'<div class="empty">Henüz veri yok.</div>';const n=all.filter(x=>x.date>=today()&&x.status!=="İptal").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];$("#forecast").innerHTML=n?`<strong>${n.name||"İsimsiz"}</strong><br>${nice(n.date)} • ${n.time||"--:--"}<br>${n.service||"Hizmet"}`:"Yaklaşan randevu yok."}
function render(){const t=today(),m=month();let a=mode==="today"?all.filter(x=>x.date===t):mode==="month"?all.filter(x=>x.date?.startsWith(m)):mode==="archive"?all.filter(x=>x.date<t):all;a=[...a].sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));if(!a.length){$("#list").innerHTML='<div class="empty">Bu görünümde randevu yok.</div>';return}$("#list").innerHTML=a.map(x=>`<article class="appt"><div class="apptdate"><strong>${x.time||"--:--"}</strong><span>${nice(x.date)}</span></div><div class="apptperson"><strong>${x.name||"İsimsiz"}</strong><span>${x.phone||"Telefon yok"}</span></div><div class="apptservice"><span>${x.service||"Hizmet"}</span><strong>${money(x.price)}</strong></div><div class="appt-actions"><select class="status" data-id="${x.id}">${["Bekliyor","Onaylandı","Tamamlandı","İptal"].map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select><button class="del" data-del="${x.id}" type="button">Sil</button></div></article>`).join("");document.querySelectorAll(".status").forEach(s=>s.onchange=()=>changeStatus(s.dataset.id,s.value));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>removeAppointment(b.dataset.del))}
async function changeStatus(id,next){const item=all.find(a=>a.id===id);if(!item)return;try{if(next==="İptal"){await runTransaction(db,async tx=>{const ref=doc(db,"appointments",id);tx.update(ref,{status:"İptal"});if(item.slotId)tx.delete(doc(db,"slots",item.slotId))})}else if(item.status==="İptal"){await runTransaction(db,async tx=>{const ref=doc(db,"appointments",id),slot=item.slotId?doc(db,"slots",item.slotId):null;if(slot){const snap=await tx.get(slot);if(snap.exists()&&snap.data().taken===true)throw new Error("SLOT_TAKEN");tx.set(slot,{date:item.date,time:item.time,taken:true,appointmentId:id,createdBy:item.createdBy||"admin",createdAt:item.createdAt||null})}tx.update(ref,{status:next})})}else{await updateDoc(doc(db,"appointments",id),{status:next})}item.status=next;calc();render()}catch(e){console.error(e);alert(e.message==="SLOT_TAKEN"?"Bu saat artık dolu. Önce başka bir saat seçilerek randevu düzenlenmeli.":"Randevu durumu güncellenemedi.");load()}}
async function removeAppointment(id){const item=all.find(a=>a.id===id);if(!confirm("Randevu silinsin ve saati tekrar boşaltılsın mı?"))return;try{await runTransaction(db,async tx=>{tx.delete(doc(db,"appointments",id));if(item?.slotId)tx.delete(doc(db,"slots",item.slotId))});all=all.filter(a=>a.id!==id);calc();render()}catch(e){console.error(e);alert("Randevu silinemedi.")}}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.m;render()});
$("#settings").onclick=()=>{$("#setEmail").value=auth.currentUser?.email||ADMIN;$("#modal").classList.remove("hidden")};$("#close").onclick=()=>$("#modal").classList.add("hidden");document.querySelector("#modal .backdrop").onclick=()=>$("#modal").classList.add("hidden");
$("#save").onclick=async()=>{const a=$("#np").value,b=$("#np2").value;if(a.length<6){$("#sm").textContent="Şifre en az 6 karakter.";return}if(a!==b){$("#sm").textContent="Şifreler eşleşmiyor.";return}try{await updatePassword(auth.currentUser,a);$("#sm").textContent="✓ Şifre değiştirildi.";$("#np").value="";$("#np2").value=""}catch(e){console.error(e);$("#sm").textContent="Güvenlik için tekrar giriş yapmanız gerekebilir. Çıkış yapıp yeniden giriş yapın."}};
onAuthStateChanged(auth,u=>{if(u&&!u.isAnonymous&&u.email?.toLowerCase()===ADMIN){$("#login").classList.add("hidden");$("#panel").classList.remove("hidden");$("#settings").classList.remove("hidden");$("#logout").classList.remove("hidden");load()}else{$("#login").classList.remove("hidden");$("#panel").classList.add("hidden")}});
</script></body></html>
