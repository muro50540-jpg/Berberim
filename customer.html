<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Randevu Al</title><link rel="stylesheet" href="style.css"><main class="card"><h1>Randevu Al</h1><form id="f"><label>Hizmet<select id="service" required><option value="">Seçiniz</option><option>Saç Kesimi</option><option>Sakal Kesimi</option><option>Saç + Sakal</option><option>Çocuk Kesimi</option></select></label><label>Berber<select id="barber" required><option value="">Seçiniz</option><option>Berber 1</option><option>Berber 2</option></select></label><label>Tarih<input id="date" type="date" required></label><label>Saat<input id="time" type="time" required></label><label>Ad Soyad<input id="name" required></label><label>Telefon<input id="phone" required></label><button>Randevuyu Oluştur</button><p id="m"></p></form></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyAKrffq7wJ0mDtPdsShYworqCIRYkR2okM",authDomain:"berberim-83c47.firebaseapp.com",projectId:"berberim-83c47",storageBucket:"berberim-83c47.firebasestorage.app",messagingSenderId:"235586545993",appId:"1:235586545993:web:c05d6500909c27f4f81298",measurementId:"G-CBR04D6NZ6"};const db=getFirestore(initializeApp(firebaseConfig));f.onsubmit=async e=>{e.preventDefault();m.textContent="Kaydediliyor...";try{await addDoc(collection(db,"appointments"),{service:service.value,barber:barber.value,date:date.value,time:time.value,name:name.value.trim(),phone:phone.value.trim(),status:"Bekliyor",createdAt:serverTimestamp()});m.textContent="Randevunuz oluşturuldu.";f.reset()}catch(x){m.textContent="Kaydedilemedi. Firestore Rules kontrol edin."}}</script>
