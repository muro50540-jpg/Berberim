<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Randevu</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><a href="index.html" class="secondary">← Geri</a><div class="brand" style="margin-top:12px">KADİR PAK HAİR STÜDİO</div><div class="welcome">RANDEVU AL</div></header><section class="card"><span class="kicker">1 • HİZMET</span><h2>Hizmet seçin</h2><div id="services" class="service-grid"></div></section><section class="card"><span class="kicker">2 • GÜN</span><h2>Gün seçin</h2><div id="dates" class="dates"></div></section><section class="card"><span class="kicker">3 • SAAT</span><h2>Saat seçin</h2><div id="times" class="times"></div><p id="slotMsg" class="message"></p></section><section class="card"><span class="kicker">4 • BİLGİLER</span><h2>Bilgileriniz</h2><div class="formgrid"><input id="name" class="input" placeholder="Ad Soyad"><input id="phone" class="input" type="tel" inputmode="tel" placeholder="Telefon"><div class="confirm full"><div><small>Hizmet</small><strong id="chosen">Sadece Saç • ₺500</strong></div><div id="chosenTime">Saat seçin</div></div><button id="book" class="primary full">RANDEVUYU ONAYLA →</button></div><p id="msg" class="message"></p></section></div><div id="modal" class="modal hidden"><div class="backdrop"></div><div class="sheet"><button id="close" class="close">×</button><span class="kicker">ÖZET</span><h2>Randevunuzu kontrol edin</h2><div class="summary"><div><span>Hizmet</span><strong id="sService"></strong></div><div><span>Tarih</span><strong id="sDate"></strong></div><div><span>Saat</span><strong id="sTime"></strong></div><div><span>Ücret</span><strong id="sPrice"></strong></div></div><button id="final" class="primary" style="width:100%">RANDEVUYU KAYDET</button><p id="finalMsg" class="message"></p></div></div><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,query,where,getDocs,doc,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAKrffq7wJ0mDtPdsShYworqCIRYkR2okM",authDomain:"berberim-83c47.firebaseapp.com",projectId:"berberim-83c47",storageBucket:"berberim-83c47.firebasestorage.app",messagingSenderId:"235586545993",appId:"1:235586545993:web:c05d6500909c27f4f81298",measurementId:"G-CBR04D6NZ6"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),$=s=>document.querySelector(s);
const services=[{id:"sac",name:"Sadece Saç",price:500,duration:30,icon:"✂"},{id:"cocuk",name:"Çocuk Tıraşı",price:300,duration:30,icon:"👦"},{id:"sac-sakal",name:"Saç + Sakal",price:600,duration:45,icon:"✂️"},{id:"damat",name:"Damat Tıraşı",price:null,duration:60,icon:"🤵"},{id:"fon",name:"Fön Çektirme",price:200,duration:30,icon:"💨"}];
let service=services[0],date="",time="",busy=new Set();
function renderServices(){ $("services").innerHTML=services.map(s=>`<button class="service ${s.id===service.id?"active":""}" data-id="${s.id}" ${s.price===null?"disabled":""}><span class="icon">${s.icon}</span><span class="main"><strong>${s.name}</strong><small>${s.price===null?"Fiyat yakında":s.duration+" dakika"}</small></span><b>${s.price===null?"Yakında":"₺"+s.price}</b></button>`).join("");document.querySelectorAll("#services .service").forEach(b=>b.onclick=()=>{service=services.find(s=>s.id===b.dataset.id);renderServices();update();});}
function makeDates(){let e=$("#dates"),d=new Date();for(let i=0;i<14;i++){let x=new Date(d);x.setDate(d.getDate()+i);let iso=x.toISOString().slice(0,10),b=document.createElement("button");b.className="date"+(i===0?" active":"");b.innerHTML=`<small>${x.toLocaleDateString("tr-TR",{weekday:"short"})}</small><strong>${x.getDate()}</strong>`;b.onclick=()=>{document.querySelectorAll(".date").forEach(z=>z.classList.remove("active"));b.classList.add("active");date=iso;time="";loadBusy()};e.appendChild(b);if(i===0)date=iso;}}
async function loadBusy(){busy.clear();$("#slotMsg").textContent="";try{let s=await getDocs(query(collection(db,"slots"),where("date","==",date)));s.forEach(x=>{if(x.data().taken)busy.add(x.data().time)});renderTimes()}catch(e){$("#slotMsg").textContent="Saatler yüklenemedi. Firebase ayarlarını kontrol edin.";renderTimes();}}
function renderTimes(){let e=$("#times");e.innerHTML="";for(let h=10;h<19;h++)for(let m of [0,30]){let t=`${String(h).padStart(2,"0")}:${m?"30":"00"}`,b=document.createElement("button");b.className="time"+(busy.has(t)?" busy":"")+(time===t?" active":"");b.textContent=busy.has(t)?"Dolu • "+t:t;b.disabled=busy.has(t);b.onclick=()=>{time=t;renderTimes();update()};e.appendChild(b)}}
function update(){$("#chosen").textContent=service.name+" • ₺"+service.price;$("#chosenTime").textContent=time||"Saat seçin";}
$("#book").onclick=()=>{if(!$("#name").value.trim()||!$("#phone").value.trim())return $("#msg").textContent="Ad Soyad ve telefon gerekli.";if(!time)return $("#msg").textContent="Lütfen saat seçin.";$("#sService").textContent=service.name;$("#sDate").textContent=new Date(date+"T12:00:00").toLocaleDateString("tr-TR");$("#sTime").textContent=time;$("#sPrice").textContent="₺"+service.price;$("#modal").classList.remove("hidden")};
$("#close").onclick=()=>$("#modal").classList.add("hidden");document.querySelector(".backdrop").onclick=()=>$("#modal").classList.add("hidden");
$("#final").onclick=async()=>{let b=$("#final");b.disabled=true;try{if(!auth.currentUser)await signInAnonymously(auth);let slotRef=doc(db,"slots",`${date}_${time.replace(":","")}`),aRef=doc(collection(db,"appointments"));await runTransaction(db,async tx=>{let s=await tx.get(slotRef);if(s.exists()&&s.data().taken)throw Error("SLOT_TAKEN");tx.set(slotRef,{date,time,taken:true,updatedAt:serverTimestamp()},{merge:true});tx.set(aRef,{name:$("#name").value.trim(),phone:$("#phone").value.trim(),date,time,service:service.name,serviceId:service.id,duration:service.duration,price:service.price,status:"Bekliyor",createdAt:serverTimestamp(),slotId:slotRef.id})});$("#finalMsg").textContent="✓ Randevunuz kaydedildi.";setTimeout(()=>location.href="index.html",1200)}catch(e){$("#finalMsg").textContent=e.message==="SLOT_TAKEN"?"Bu saat az önce doldu. Başka saat seçin.":"Randevu kaydedilemedi.";await loadBusy()}finally{b.disabled=false}};
signInAnonymously(auth).catch(()=>{});renderServices();makeDates();update();loadBusy();
</script></body></html>
