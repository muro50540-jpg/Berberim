<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Randevu • KADİR PAK HAİR STÜDİO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="back" href="index.html">←</a>
    <div><strong>KADİR PAK</strong><small>HAİR STÜDİO</small></div>
  </header>
  <main class="card form-card">
    <div class="eyebrow">RANDEVU</div>
    <h1>Randevunuzu oluşturun</h1>
    <p class="muted">Bilgilerinizi doldurun, size uygun zamanı seçin.</p>
    <form id="appointmentForm">
      <div class="grid">
        <label>Hizmet
          <select id="service" required>
            <option value="">Hizmet seçin</option>
            <option>Saç Kesimi</option><option>Saç + Sakal</option><option>Sakal</option>
            <option>Çocuk Saç Kesimi</option><option>Bakım</option>
          </select>
        </label>
        <label>Berber
          <select id="barber" required>
            <option value="">Berber seçin</option>
            <option>Kadir Pak</option>
          </select>
        </label>
        <label>Tarih<input id="date" type="date" required></label>
        <label>Saat<input id="time" type="time" required></label>
        <label class="full">Ad Soyad<input id="name" required placeholder="Adınız ve soyadınız"></label>
        <label class="full">Telefon<input id="phone" required inputmode="tel" placeholder="05xx xxx xx xx"></label>
      </div>
      <button class="btn primary fullbtn" type="submit">RANDEVUYU OLUŞTUR <b>→</b></button>
      <div id="msg"></div>
    </form>
  </main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyAKrffq7wJ0mDtPdsShYworqCIRYkR2okM",
 authDomain:"berberim-83c47.firebaseapp.com",
 projectId:"berberim-83c47",
 storageBucket:"berberim-83c47.firebasestorage.app",
 messagingSenderId:"235586545993",
 appId:"1:235586545993:web:c05d6500909c27f4f81298",
 measurementId:"G-CBR04D6NZ6"
};
const db=getFirestore(initializeApp(firebaseConfig));
const form=document.querySelector("#appointmentForm"), msg=document.querySelector("#msg"), date=document.querySelector("#date");
date.min=new Date().toISOString().slice(0,10);
form.addEventListener("submit",async e=>{
 e.preventDefault(); msg.className="notice"; msg.textContent="Randevunuz kaydediliyor…";
 try{
  await addDoc(collection(db,"appointments"),{
   service:service.value, barber:barber.value, date:date.value, time:time.value,
   name:name.value.trim(), phone:phone.value.trim(), status:"Bekliyor", createdAt:serverTimestamp()
  });
  form.reset(); date.min=new Date().toISOString().slice(0,10);
  msg.className="notice success"; msg.textContent="Randevunuz başarıyla oluşturuldu. Görüşmek üzere!";
 }catch(err){ console.error(err); msg.className="notice error"; msg.textContent="Randevu kaydedilemedi. Lütfen tekrar deneyin."; }
});
</script>
</body>
</html>
