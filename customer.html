<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Randevu • KADİR PAK HAİR STÜDİO</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="appointment-page">

<header class="app-header">
  <a class="back-btn" href="index.html">‹</a>
  <div class="header-brand">
    <b>KADİR PAK</b>
    <span>HAİR STÜDİO</span>
  </div>
</header>

<main class="appointment-shell">

  <section class="selected-service">
    <div class="service-icon">♙</div>
    <div class="service-info">
      <b id="selectedServiceName">Saç Sakal</b>
      <span id="selectedServiceDuration">30 dk</span>
    </div>
    <strong id="selectedServicePrice">₺700</strong>
  </section>

  <section class="booking-section">
    <h2>TARİH SEÇİMİ</h2>
    <div class="date-scroller" id="dates"></div>
  </section>

  <section class="booking-section">
    <h2>SAAT SEÇİMİ</h2>
    <div class="time-grid" id="times"></div>
  </section>

  <section class="booking-section">
    <h2>HİZMET SEÇİMİ</h2>
    <div class="service-options">
      <button class="service-option active" data-service="Saç Sakal" data-duration="30" data-price="700">
        <span class="mini-icon">♙</span><span><b>Saç Sakal</b><small>30 dk</small></span><strong>₺700</strong>
      </button>
      <button class="service-option" data-service="Saç Kesimi" data-duration="30" data-price="400">
        <span class="mini-icon">♙</span><span><b>Saç Kesimi</b><small>30 dk</small></span><strong>₺400</strong>
      </button>
      <button class="service-option" data-service="Sakal" data-duration="20" data-price="300">
        <span class="mini-icon">♙</span><span><b>Sakal</b><small>20 dk</small></span><strong>₺300</strong>
      </button>
    </div>
  </section>

  <section class="booking-section">
    <h2>USTA SEÇİMİ</h2>
    <div class="barber-option active">Kadir Pak <small>Uzman Berber</small></div>
  </section>

  <section class="customer-form">
    <h2>BİLGİLERİNİZ</h2>
    <input id="name" placeholder="Ad Soyad">
    <input id="phone" placeholder="Telefon" inputmode="tel">
    <button id="openConfirm" class="bottom-cta">RANDEVUYU ONAYLA <span>→</span></button>
    <div id="msg"></div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-sheet">
    <button class="modal-close" id="close">×</button>
    <h3>Randevuyu onayla</h3>
    <p>Bu randevuyu oluşturmak istiyor musunuz?</p>
    <div id="summary" class="summary"></div>
    <div class="modal-buttons">
      <button id="cancel" class="cancel">Vazgeç</button>
      <button id="confirm" class="approve">Onayla</button>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAKrffq7wJ0mDtPdsShYworqCIRYkR2okM",
 authDomain:"berberim-83c47.firebaseapp.com",
 projectId:"berberim-83c47",
 storageBucket:"berberim-83c47.firebasestorage.app",
 messagingSenderId:"235586545993",
 appId:"1:235586545993:web:c05d6500909c27f4f81298",
 measurementId:"G-CBR04D6NZ6"
};
const db=getFirestore(initializeApp(firebaseConfig));

let selected={service:"Saç Sakal",duration:30,price:700};
let selectedDate="",selectedTime="",selectedBarber="Kadir Pak";

const dates=document.querySelector("#dates");
const times=document.querySelector("#times");
const today=new Date(); today.setHours(0,0,0,0);

const days=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];

for(let i=0;i<14;i++){
 const d=new Date(today); d.setDate(today.getDate()+i);
 const b=document.createElement("button");
 b.className="date-card"+(i===0?" active":"");
 b.innerHTML=`<span>${days[d.getDay()]}</span><b>${d.getDate()}</b>`;
 b.dataset.date=d.toISOString().slice(0,10);
 b.onclick=()=>{
   document.querySelectorAll(".date-card").forEach(x=>x.classList.remove("active"));
   b.classList.add("active"); selectedDate=b.dataset.date; renderTimes();
 };
 dates.appendChild(b);
}
selectedDate=dates.firstElementChild.dataset.date;

function renderTimes(){
 times.innerHTML="";
 for(let h=9;h<=19;h++){
   for(const m of [0,30]){
     if(h===19&&m===30) continue;
     const t=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
     const b=document.createElement("button");
     b.className="time-card available";
     b.innerHTML=`<b>${t}</b>`;
     b.onclick=()=>{
       document.querySelectorAll(".time-card").forEach(x=>x.classList.remove("active"));
       b.classList.add("active"); selectedTime=t;
     };
     times.appendChild(b);
   }
 }
}
renderTimes();

document.querySelectorAll(".service-option").forEach(btn=>{
 btn.onclick=()=>{
   document.querySelectorAll(".service-option").forEach(x=>x.classList.remove("active"));
   btn.classList.add("active");
   selected={service:btn.dataset.service,duration:+btn.dataset.duration,price:+btn.dataset.price};
   selectedServiceName.textContent=selected.service;
   selectedServiceDuration.textContent=selected.duration+" dk";
   selectedServicePrice.textContent="₺"+selected.price;
 };
});

function closeModal(){modal.classList.remove("show")}
close.onclick=closeModal; cancel.onclick=closeModal;

openConfirm.onclick=()=>{
 if(!name.value.trim()||!phone.value.trim()||!selectedDate||!selectedTime){
   msg.className="notice error";msg.textContent="Lütfen ad, telefon, tarih ve saat seçin.";return;
 }
 const pretty=new Date(selectedDate+"T00:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric",weekday:"long"});
 summary.innerHTML=`
   <div>${selected.service} (${selected.duration} dk)</div>
   <div>Ücret: ₺${selected.price}</div>
   <div>Usta: ${selectedBarber}</div>
   <div>${pretty}, ${selectedTime}</div>`;
 modal.classList.add("show");
};

confirm.onclick=async()=>{
 confirm.disabled=true;confirm.textContent="Kaydediliyor…";
 try{
   await addDoc(collection(db,"appointments"),{
     service:selected.service,duration:selected.duration,price:selected.price,
     barber:selectedBarber,date:selectedDate,time:selectedTime,
     name:name.value.trim(),phone:phone.value.trim(),status:"Bekliyor",createdAt:serverTimestamp()
   });
   closeModal();
   msg.className="notice success";msg.textContent="Randevunuz başarıyla oluşturuldu.";
 }catch(e){
   msg.className="notice error";msg.textContent="Randevu kaydedilemedi. Lütfen tekrar deneyin.";
 }
 confirm.disabled=false;confirm.textContent="Onayla";
};
</script>
</body>
</html>
